<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'"><title>PayGlass</title><link rel="icon" href="assets/diamond.svg"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="compact.css"></head><body>
<header class="titlebar"><div class="brand"><button id="toggleSidebar" aria-label="Toggle sidebar" title="Toggle sidebar">☰</button><img src="assets/diamond.svg" alt=""><strong>PayGlass</strong></div><div class="conversationHeader"><button id="chatDetailsToggle" class="conversationIdentity" aria-label="Conversation details"><h1 id="conversationTitle">Select a conversation</h1><span>⌄</span></button><div class="headerButtons"><button id="toggleSelection" title="Select messages" aria-label="Select messages">☑</button><button id="toggleFind" title="Find in conversation" aria-label="Find in conversation">⌕</button><button id="copyConversation" title="Copy conversation" aria-label="Copy conversation" disabled>⧉</button><button id="exportConversation" title="Export conversation" aria-label="Export conversation" disabled>↥</button></div></div><div class="windowButtons"><button id="minimize" aria-label="Minimize">―</button><button id="maximize" aria-label="Maximize">□</button><button id="closeWindow" aria-label="Close">×</button></div></header>
<div class="shell"><aside id="sidebar"><div class="sidebarTop"><h2>Conversations</h2><button id="refresh" title="Refresh library" aria-label="Refresh library">↻</button></div><div class="searchBox"><span>⌕</span><input id="librarySearch" type="search" placeholder="Search" aria-label="Search conversations"></div><div class="providerTabs" role="group" aria-label="Conversation source"><button data-provider="all" class="active">All</button><button data-provider="codex">Codex</button><button data-provider="claude">Claude Code</button></div><div class="listMeta"><span id="resultCount">Scanning…</span><span id="appStatus">Loading library…</span></div><nav id="chatList" aria-label="Conversations"></nav><footer class="sidebarFooter"><button id="settingsButton">⚙ Settings</button><span id="libraryState"></span></footer></aside><div id="sidebarResize" class="resize vertical" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize conversation sidebar"></div>
<main><div id="chatDetails" class="popover hidden"><span id="providerBadge">Library</span><span id="messageCount"></span><div id="conversationPath" class="path"></div></div><div class="selectionBar hidden"><div class="selectionActions"><span>Select</span><button id="selectAll" disabled>All</button><button id="selectUser" disabled>User</button><button id="selectAssistant" disabled>Assistant</button><button id="deselectAll" disabled>None</button></div><div class="selectionActions"><span id="selectionCount">0 selected</span><button id="copySelected" disabled>Copy selected</button><button id="closeSelection" aria-label="Close message selection">×</button></div></div><div class="findBar hidden"><input id="messageSearch" type="search" placeholder="Find in conversation" aria-label="Find in this conversation" disabled><button id="closeFind" aria-label="Close search">×</button></div>
<section id="messages" aria-label="Conversation messages"><div class="empty"><h2>Select a conversation</h2><button id="emptySettings">Choose history folders</button></div></section><button id="jumpBottom" class="jumpBottom" disabled title="Jump to latest message" aria-label="Jump to latest message">↓</button><div id="continuationResize" class="resize horizontal" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize local chat composer"></div>
<section id="localChat"><div id="continueOptions" class="localOptions popover hidden"><label>Prompt<select id="promptPreset" aria-label="Prompt preset"><option value="continue">Continue chat</option><option value="summarize">Summarize</option><option value="handoff">Resume work</option></select></label><label>Context<select id="contextMode" aria-label="Conversation context"><option value="recent">Recent history</option><option value="selected">Selected messages</option></select></label><button id="detectModels">↻ Detect models</button><span id="localStatus">Detecting models…</span><span id="contextInfo"></span></div><form id="continueForm"><button type="button" id="toggleContinueOptions" aria-label="Local chat options" title="Prompt and context options">＋</button><textarea id="composer" rows="1" placeholder="Write a message…" aria-label="Message local model" disabled></textarea><button type="button" id="stopReply" class="hidden" aria-label="Stop reply">■</button><button type="submit" id="sendReply" disabled aria-label="Send message">↑</button></form><div class="composerMeta"><span id="replyStatus"></span><select id="modelSelect" aria-label="Local language model"><option value="">Detecting models…</option></select></div></section></main></div>
<div id="toast" role="status" class="hidden"></div><div id="modalOverlay" class="hidden"><section id="settingsModal" role="dialog" aria-modal="true" aria-label="Settings"><header><h2>Settings</h2><button id="closeSettings" aria-label="Close settings">×</button></header><div id="settingsContent"></div></section></div><script src="renderer.js"></script></body></html>
